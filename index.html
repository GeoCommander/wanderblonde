    body {
      margin: 0;

      background: #e7e8ec;
      color: #000;
      text-align: center;

    .page {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 46px 22px 42px;
      background: #eef0f3;
    }

    .avatar {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 18px;
      background: #ddd;
    }

    h1 {
      font-size: 34px;
      line-height: 1.1;
      margin: 0 0 10px;
      font-weight: 850;
      letter-spacing: -0.5px;
    }

    .bio {
      font-size: 18px;
      line-height: 1.45;
      margin: 0 auto 20px;
      color: #000;
      max-width: 470px;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 22px;
      margin-bottom: 30px;
    }

    .socials a {
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #000;
      text-decoration: none;
    }

    .socials svg {
      width: 30px;
      height: 30px;
      fill: currentColor;
    }

    .section-title {
      font-size: 18px;
      font-weight: 850;
      margin: 6px 0 12px;
    }

    .video-wrap {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      margin: 0 0 18px;
      border-radius: 18px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 8px 22px rgba(0,0,0,0.12);
    }

    .video-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .card {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 78px;
      background: #fff;
      color: #000;
      text-decoration: none;
      border-radius: 14px;
      margin: 14px 0;
      padding: 10px 16px 10px 10px;
      box-shadow: 0 1px 0 rgba(0,0,0,0.02);
    }

    .card-image {
      width: 58px;
      height: 58px;
      border-radius: 10px;
      object-fit: cover;
      flex: 0 0 auto;
      margin-right: 14px;
      background: #ddd;
    }

    .card-text {
      flex: 1;
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.35;
    }

    .small-text {
      display: block;
      margin-top: 4px;
      font-size: 13px;
      font-weight: 650;
      color: #555;
    }

    .menu {
      color: #777;
      font-size: 24px;
      line-height: 1;
      margin-left: 12px;
    }

    .username-box {
      background: #fff;
      border-radius: 14px;
      padding: 18px;
      margin: 14px 0;
      text-align: left;
      box-shadow: 0 1px 0 rgba(0,0,0,0.02);
    }

    .username-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      font-size: 16px;
      line-height: 1.35;
    }

    .username-row strong {
      white-space: nowrap;
    }

    .username-row span {
      text-align: right;
      font-weight: 750;

    .join {

      color: #000;
      text-decoration: none;
      font-size: 20px;
      font-weight: 850;
      padding: 18px 28px;

    .footer {

      font-size: 12px;
      color: #555;
    }

    @media (max-width: 420px) {
